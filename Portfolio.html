<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Asankhan Nurtilek — Senior Golang Developer</title>
  <meta name="description" content="Backend engineer specializing in distributed Go systems. FinTech, IoT, Computer Vision." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="variants/v1-terminal/src/styles.css?v=7" />
  <link rel="stylesheet" href="variants/v1-terminal/src/v1-overrides.css?v=7" />
  <link rel="stylesheet" href="variants/v1-terminal/src/stack.css?v=7" />
  <link rel="stylesheet" href="variants/v1-terminal/src/game.css?v=7" />
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="variants/v1-terminal/src/i18n.js?v=7"></script>
  <script src="variants/v1-terminal/src/stack-data.js?v=7"></script>
  <script type="text/babel" src="variants/v1-terminal/src/Terminal.jsx?v=7"></script>
  <script type="text/babel" src="variants/v1-terminal/src/ArchGraph.jsx?v=7"></script>
  <script type="text/babel" src="variants/v1-terminal/src/sections.jsx?v=7"></script>
  <script type="text/babel" src="variants/v1-terminal/src/StackSection.jsx?v=7"></script>
  <script src="variants/v1-terminal/src/gopher-sprites.js?v=7"></script>
  <script type="text/babel" src="variants/v1-terminal/src/GopherRunner.jsx?v=7"></script>
  <script type="text/babel" src="variants/v1-terminal/src/app.jsx?v=7"></script>

  <!-- Кайрат Нуртас Easter egg -->
  <div id="nurtas-overlay" style="
    display:none; position:fixed; inset:0; z-index:9999;
    background:rgba(0,0,0,0.92); flex-direction:column;
    align-items:center; justify-content:center; gap:16px;
  ">
    <div style="text-align:center; font-family:'JetBrains Mono',monospace;">
      <div style="font-size:13px; color:#666; letter-spacing:.1em; margin-bottom:8px;">СЕНІ АЛДАДЫМ</div>
      <div style="font-size:28px; font-weight:600; color:#fff; margin-bottom:4px;">Кайрат Нұртас</div>
      <div style="font-size:13px; color:#888; margin-bottom:20px;">♪ ♪ ♪</div>
    </div>
    <iframe id="nurtas-frame"
      width="560" height="315"
      src=""
      title="Кайрат Нуртас"
      frameborder="0"
      allow="autoplay; encrypted-media"
      allowfullscreen
      style="border-radius:8px; max-width:90vw;"
    ></iframe>
    <button onclick="closeNurtas()" style="
      margin-top:16px; padding:10px 28px;
      background:transparent; border:1px solid #444; border-radius:6px;
      color:#888; font-family:'JetBrains Mono',monospace; font-size:13px;
      cursor:pointer; letter-spacing:.05em;
    " onmouseover="this.style.borderColor='#888';this.style.color='#fff'"
       onmouseout="this.style.borderColor='#444';this.style.color='#888'">
      [ ESC ] жабу / закрыть
    </button>
  </div>

  <script>
    // YouTube video ID — замени на любой трек Кайрат Нуртаса
    var NURTAS_VIDEO_ID = "uZy0-fQOBj8";

    function triggerNurtas() {
      var overlay = document.getElementById("nurtas-overlay");
      var frame = document.getElementById("nurtas-frame");
      frame.src = "https://www.youtube.com/embed/" + NURTAS_VIDEO_ID + "?autoplay=1&rel=0";
      overlay.style.display = "flex";
    }

    function closeNurtas() {
      var overlay = document.getElementById("nurtas-overlay");
      var frame = document.getElementById("nurtas-frame");
      frame.src = "";
      overlay.style.display = "none";
    }

    window.triggerNurtas = triggerNurtas;

    // Konami code: ↑↑↓↓←→←→BA
    (function() {
      var seq = [38,38,40,40,37,39,37,39,66,65];
      var pos = 0;
      document.addEventListener("keydown", function(e) {
        if (e.keyCode === seq[pos]) {
          pos++;
          if (pos === seq.length) { triggerNurtas(); pos = 0; }
        } else {
          pos = e.keyCode === seq[0] ? 1 : 0;
        }
      });
    })();

    // ESC to close
    document.addEventListener("keydown", function(e) {
      if (e.key === "Escape") closeNurtas();
    });
  </script>
</body>
</html>
